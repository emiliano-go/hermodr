[package]
name = "hermodr-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WhatsApp protocol core for Hermóðr, built on whatsapp-rust"

[dependencies]
whatsapp-rust = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
# Renders the pairing QR to the terminal. Kept in-crate so the spike has no
# system dependency like `qrencode`.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# The UI consumes these types directly over Tauri IPC.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Fetches Open Graph metadata for link previews on outgoing messages.
ureq = "3"
# Renders outgoing image thumbnails so recipients see a preview before the
# file finishes downloading.
buffa = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# Received thumbnails are kept in the row as `data:` URIs.
base64 = "0.22"

# Media Foundation decodes the first frame of outgoing videos for their preview.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_UI_Shell"] }
