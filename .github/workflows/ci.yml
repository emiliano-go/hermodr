name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # sccache cannot cache incremental builds.
  CARGO_INCREMENTAL: 0
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Self-checks
        run: |
          node --experimental-strip-types src/lib/phone.ts
          node --experimental-strip-types src/lib/format.ts
          node --experimental-strip-types --test src/lib/files.test.ts
          node --experimental-strip-types --test src/lib/state/message-actions.test.ts
          node --experimental-strip-types --test src/lib/notices.test.ts
          node --experimental-strip-types --test src/lib/retention.test.ts
          node --experimental-strip-types --test src/lib/message-window.test.ts

  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      # .cargo/config.toml links with lld on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lld
      - run: cargo test --locked --manifest-path crates/postal-core/Cargo.toml
      - run: sccache --show-stats

  tauri:
    name: Tauri shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y lld libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # The shell embeds the built frontend, so it has to exist before compiling.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: sccache --show-stats
