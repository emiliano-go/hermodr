[workspace]
members = ["crates/postal-core", "crates/postal-plugins"]
# The Tauri app has its own manifest that depends on a local Tauri checkout, so
# it stays outside this workspace rather than nesting one inside the other.
exclude = ["src-tauri"]
resolver = "2"

[profile.dev]
# Match the app's dev profile: line tables for our crates, none for deps.
debug = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/emiliano-go/postal"

[workspace.dependencies]
# Pinned to a revision rather than the crates.io release: history-sync admission
# control (`HistorySyncAdmission`) exists here but not in 0.7.0.
# Consumed from a local checkout at rev 6f18f5d3 (the checkout at ../whatsapp-rust),
# because the repository's own .cargo/config.toml injects nightly-only rustflags
# that would break a stable build if it were vendored as a git dependency.
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "6f18f5d3c98a4e72a498eb4966c67a990da4a59d", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "ureq-client", "tokio-native", "signal"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "fs"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
