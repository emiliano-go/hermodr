[workspace]
members = ["crates/postal-core"]
# The Tauri app has its own manifest that depends on a local Tauri checkout, so
# it stays outside this workspace rather than nesting one inside the other.
exclude = ["src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/emiliano-go/postal"

[workspace.dependencies]
# Pinned to a revision rather than the crates.io release: history-sync admission
# control (`HistorySyncAdmission`) exists here but not in 0.7.0.
# Consumed from a local checkout at rev 9eb43b9bc2bc561cc34a672b4295528bf4c2d733,
# because the repository's own .cargo/config.toml injects nightly-only rustflags
# that would break a stable build if it were vendored as a git dependency.
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "9eb43b9bc2bc561cc34a672b4295528bf4c2d733" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
